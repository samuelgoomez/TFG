[project]
name = "abstrack"
version = "0.1.0"
description = "ABSTRACK using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "apscheduler>=3.11.2",
    "crewai[google-genai,tools]==1.9.3",
    "email-validator>=2.3.0",
    "fastapi>=0.136.0",
    "fastapi-sso>=0.21.0",
    "litellm>=1.75.3",
    "python-dotenv>=1.1.1",
    "pdfplumber>=0.11",
]

[project.scripts]
abstrack = "abstrack.main:run"
run_crew = "abstrack.main:run"
train = "abstrack.main:train"
replay = "abstrack.main:replay"
test = "abstrack.main:test"
run_with_trigger = "abstrack.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
