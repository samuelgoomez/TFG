[project]
name = "papercrew"
version = "0.1.0"
description = "PaperCrew using crewAI"
authors = [{ name = "Samuel Gómez", email = "samuelgomezgrande2003@gmail.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.9.3",
    "litellm>=1.75.3",
    "python-dotenv>=1.1.1",
    "pdfplumber>=0.11",
    "streamlit>=1.35",
]

[project.scripts]
papercrew = "papercrew.main:run"
papercrew-web = "papercrew.app:launch"
run_crew = "papercrew.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
