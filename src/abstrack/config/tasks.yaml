# 2. Tarea de adquisición de información
tarea_adquisicion:
  description: >
    Inicia una entrevista con el autor utilizando la herramienta proporcionada para hacerle preguntas.
    Tu objetivo es recabar información clara y detallada sobre los siguientes 6 aspectos del artículo:
    1. El tema o problema abordado.
    2. El objetivo principal del trabajo.
    3. La metodología seguida.
    4. Los resultados obtenidos.
    5. La principal conclusión o aportación.
    6. Restricciones (como el límite de palabras o el contexto del documento).
    
    INSTRUCCIONES CLAVE:
    - No pidas todos los puntos a la vez. Haz preguntas concisas y secuenciales.
    - Analiza cada respuesta del usuario. Si es demasiado vaga, incompleta o desordenada, no pases a la siguiente pregunta. Vuelve a formular la pregunta exigiendo amablemente más detalles (ej. "¿Podrías darme números específicos de los resultados?").
    - Continúa el diálogo hasta que tengas la certeza de que los 6 puntos están completos y bien definidos.
  expected_output: >
    Un informe estructurado (texto limpio) que contenga los 6 puntos clave detallados, usando como base la información aportada por el usuario. No debes incluir la transcripción de la entrevista ni texto de relleno, solo los datos duros clasificados bajo 6 encabezados (Problema, Objetivo, Metodología, Resultados, Conclusión, Restricciones).
  agent: agente_de_adquisicion_de_informacion
  output_file: "informe_entrevista.md"

# 3. Tarea de validación de completitud
tarea_validacion:
  description: >
    Revisa detenidamente el informe final generado por la tarea de adquisición de información (tarea_adquisicion).
    Analiza los 6 puntos clave comprobando que:
    1. El problema y el objetivo están bien definidos.
    2. La metodología tiene detalles técnicos y no es genérica.
    3. Los resultados aportan datos concretos (cuantitativos o cualitativos).
    4. La conclusión es específica y relevante.
    
    Si encuentras carencias, inconsistencias o información genérica (ej. resultados sin números), DEBES usar tu herramienta de delegación para devolverle la tarea al agente "Entrevistador Académico Experto y Recopilador de Datos".
    Al realizar la delegación, tu mensaje o contexto debe empezar SIEMPRE con la frase exacta: "NO VALIDADO. Devolviendo al agente de adquisición de información...". Después de esa frase, indícale exactamente qué pregunta nueva debe hacerle al usuario para completar las lagunas.
    No des el informe por válido hasta que toda la información sea sólida.
  expected_output: >
    Una única palabra: "VALIDADO" si la información es correcta. No debes reescribir, resumir ni estructurar el informe bajo ninguna circunstancia. Si faltan datos, debes devolver el control al agente anterior usando la herramienta de delegación.
  agent: agente_de_validacion_de_completitud

